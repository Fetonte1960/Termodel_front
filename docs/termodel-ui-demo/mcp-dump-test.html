<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Termodel MCP — test ricezione testo</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color-scheme:light}
body{max-width:1100px;margin:24px auto;padding:0 18px;background:#f6f8fa;color:#152334}
h1{font-size:1.4rem}
section{background:white;border:1px solid #cbd5e1;border-radius:8px;padding:18px;margin:14px 0}
button{padding:10px 14px;cursor:pointer;margin:4px 6px 4px 0}
textarea{width:100%;box-sizing:border-box;min-height:340px;font:13px/1.5 ui-monospace,Consolas,monospace;resize:vertical}
code{overflow-wrap:anywhere}
#status{font-weight:600}
#session{font:13px Consolas,monospace;word-break:break-all}
small{color:#405268}

header{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
header h1{font-size:1.05rem;font-weight:600;margin:0}
header small{font-size:.7rem;color:#64748b;font-weight:400}
.tabs{display:flex;gap:5px;border-bottom:1px solid #cbd5e1;margin:8px 0 0}
.tabs button{border:1px solid #cbd5e1;border-bottom:0;border-radius:6px 6px 0 0;background:#e9eef4;margin:0}
.tabs button[aria-selected="true"]{background:white;font-weight:700}
.tab-panel{display:none;background:white;padding:12px;border:1px solid #cbd5e1;border-top:0;min-height:520px}
.tab-panel.active{display:block}
.view{width:100%;height:min(68vh,650px);background:#f3f6f8;border:1px solid #dbe3eb;position:relative;overflow:hidden}
.view canvas{display:block;width:100%;height:100%}
#view2d svg{max-width:100%;max-height:100%;width:100%;height:100%}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.filters label{font-size:12px;white-space:nowrap}
#preview-info{font-size:.8rem;color:#536477}
</style>
</head>
<body>
<header><h1>Termodel MCP — Laboratorio</h1><small id="harness-version"></small></header>
<nav class="tabs" aria-label="Viste"><button type="button" role="tab" aria-selected="true" data-tab="3d">3D</button><button type="button" role="tab" aria-selected="false" data-tab="2d">2D</button><button type="button" role="tab" aria-selected="false" data-tab="comunicazione">Comunicazione</button></nav>
<div id="tab-3d" class="tab-panel active" role="tabpanel">
  <div class="filters"><label><input type="checkbox" id="filter-walls" checked> Pareti</label><label><input type="checkbox" id="filter-floor" checked> Pavimenti</label><label><input type="checkbox" id="filter-edges" checked> Spigoli</label></div>
  <div id="view3d" class="view"></div><p id="preview-info">In attesa di un progetto valido. Anteprima 3D sperimentale.</p>
</div>
<div id="tab-2d" class="tab-panel" role="tabpanel"><div id="view2d" class="view"></div></div>
<div id="tab-comunicazione" class="tab-panel" role="tabpanel">
<section>
<button id="connect">Attiva comunicazione MCP</button>
<button id="disconnect" disabled>Disconnetti</button>
<button id="copy" disabled>Copia codice sessione</button>
<button id="open-gpt">Esegui GPT con programmazione Termodel</button>
<button id="open-alt" type="button" disabled>Esegui Claude con istruzioni Termodel</button>
<p id="status" role="status">Disconnesso.</p>
<div id="session"></div>
<small>Il codice sessione consente l'invio di comandi a questa finestra: condividilo solo con la tua chat di prova. Mantieni aperta la scheda.</small>
</section>
<section>
<label for="dump"><strong>Testo ricevuto (nessuna esecuzione)</strong></label>
<textarea id="dump" readonly spellcheck="false" placeholder="Il testo ricevuto tramite MCP apparirà qui."></textarea>
<p id="size"></p>
<button id="clear">Svuota testo</button>
<button id="copy-project" disabled>Copia progetto negli appunti</button>
</section>
</div>
<dialog id="failure-modal" aria-labelledby="failure-title"><h2 id="failure-title">Progetto non valido</h2><p id="failure-message" style="white-space:pre-wrap"></p><button id="failure-close">Chiudi</button></dialog>
<script src="https://cdn.jsdelivr.net/npm/jsts@2.12.1/dist/jsts.min.js"></script>
<script>
(() => {
  'use strict';
  const HARNESS_VERSION = '1.6';
  document.getElementById('harness-version').textContent = 'V' + HARNESS_VERSION;
  const base = 'https://termodel-mcp-gateway.onrender.com';
  const el = id => document.getElementById(id);
  let abort = null, sessionId = '', browserToken = '';
  let validatedProjectText = '';
  let previewPlan = null;
  let setPreview = () => {};
  const setStatus = message => { el('status').textContent = message; };
  const ui = active => {
    el('connect').disabled = active;
    el('disconnect').disabled = !active;
    el('copy').disabled = !active;
    el('open-alt').disabled = !active;
  };
  function svgPayload(text) {
    const upper=text.toUpperCase();
    const marker='[TERMODEL-SVG-TEXT-V1]';
    const endMarker='[/TERMODEL-SVG-TEXT-V1]';
    let source=text;
    const start=upper.indexOf(marker);
    if (start>=0) {
      const end=upper.indexOf(endMarker,start+marker.length);
      if (end<0) throw Error('Payload TERMODEL-SVG-TEXT-V1 incompleto: manca il marcatore finale.');
      const html=text.slice(start+marker.length,end).trim();
      if (!html) throw Error('Payload TERMODEL-SVG-TEXT-V1 vuoto.');
      const field=document.createElement('textarea');
      field.innerHTML=html;
      source=field.value;
    }
    const begin=source.toLowerCase().indexOf('<svg');
    const end=source.toLowerCase().lastIndexOf('</svg>');
    if (begin<0 || end<begin) throw Error('Blocco SVG non trovato.');
    return source.slice(begin,end+6).trim();
  }
  // Recupero conservativo: soltanto un perimetro semplice chiuso, non un progetto multipiano.
  function repairUnlabeledPerimeter(svg) {
    const xml=new DOMParser().parseFromString(svg,'image/svg+xml');
    if (xml.querySelector('parsererror')) throw Error('SVG XML non valido');
    const group=Array.from(xml.documentElement.children).find(n=>n.localName==='g'&&n.id==='calpestabile');
    if (!group) return {svg,changes:[]};
    const lines=Array.from(group.children).filter(n=>n.localName==='line');
    const missing=lines.filter(n=>!n.getAttribute('id'));
    if (!missing.length) return {svg,changes:[]};
    // No implicit guesses when mixed named/unnamed walls or additional lines exist.
    if (missing.length!==lines.length || lines.length<3)
      throw Error('Pareti senza id in geometria mista: classificazione ambigua, correzione non automatica.');
    const edge=lines.map(n=>{
      const values=['x1','y1','x2','y2'].map(k=>Number(n.getAttribute(k)));
      if (values.some(v=>!Number.isFinite(v))) throw Error('Coordinate pareti non valide.');
      const [x1,y1,x2,y2]=values;
      if(x1===x2&&y1===y2) throw Error('Parete di lunghezza nulla.');
      return {n,a:[x1,y1].join(','),b:[x2,y2].join(',')};
    });
    const degree=new Map();
    for(const e of edge)for(const p of [e.a,e.b])degree.set(p,(degree.get(p)||0)+1);
    if(degree.size!==edge.length||Array.from(degree.values()).some(v=>v!==2))
      throw Error('Linee senza id: il perimetro non è un anello semplice chiuso.');
    const visited=new Set(),todo=[edge[0].a];
    while(todo.length){
      const p=todo.pop();if(visited.has(p))continue;visited.add(p);
      for(const e of edge){if(e.a===p&&!visited.has(e.b))todo.push(e.b);if(e.b===p&&!visited.has(e.a))todo.push(e.a);}
    }
    if(visited.size!==degree.size)throw Error('Più anelli non collegati: impossibile classificare automaticamente.');
    // Reject intersections not at endpoints: no silent topology repair.
    const seg=e=>[e.a.split(',').map(Number),e.b.split(',').map(Number)];
    const cross=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);
    for(let i=0;i<edge.length;i++)for(let j=i+1;j<edge.length;j++){
      const e=edge[i],f=edge[j];
      if([e.a,e.b].some(p=>p===f.a||p===f.b))continue;
      const [a,b]=seg(e),[c,d]=seg(f);
      if(cross(a,b,c)*cross(a,b,d)<0&&cross(c,d,a)*cross(c,d,b)<0)
        throw Error('Perimetro auto-intersecante: correzione non automatica.');
    }
    edge.forEach((e,i)=>e.n.setAttribute('id','E'+String(i+1).padStart(3,'0')));
    return {svg:new XMLSerializer().serializeToString(xml),changes:['Assegnati '+edge.length+' identificativi E alle pareti del perimetro chiuso; coordinate invariate']};
  }
  function encodeSvgTransport(original,updated) {
    if(!original.toUpperCase().includes('[TERMODEL-SVG-TEXT-V1]'))return updated;
    const encoded=updated.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
    return '[TERMODEL-SVG-TEXT-V1]\n'+encoded+'\n[/TERMODEL-SVG-TEXT-V1]';
  }
  async function validateIncoming(command) {
    if (!/^ReadProject(?:\r?\n|$)/.test(command))
      return {handled:false};
    const value=command.replace(/^ReadProject\r?\n?/, '');
    if (!value.trim()) throw Error('ReadProject vuoto.');
    if (value.toUpperCase().includes('[TERMODEL-PROJECT-TEXT-V1]')) {
      const {loadTermodelProjectText}=await import('./archivio-web.js?v=0.82');
      const project=await loadTermodelProjectText(value);
      if(project.geometrySvg) {
        const {generaPiantaDaSvg}=await import('./genera-pianta.js?v=0.71');
        previewPlan=generaPiantaDaSvg(project.geometrySvg);
      }
      return {handled:true,label:'Progetto completo',detail:project.projectName};
    }
    if (value.toUpperCase().includes('[TERMODEL-SVG-TEXT-V1]') || /<svg\b/i.test(value)) {
      const {generaPiantaDaSvg}=await import('./genera-pianta.js?v=0.71');
      const original=svgPayload(value);
      let corrected=original, changes=[];
      try { generaPiantaDaSvg(original); }
      catch(firstError) {
        const repair=repairUnlabeledPerimeter(original);
        if(!repair.changes.length)throw firstError;
        corrected=repair.svg;changes=repair.changes;
      }
      const result=generaPiantaDaSvg(corrected);
      previewPlan=result;
      return {handled:true,label:'Pianta SVG',detail:String(result.stats?.linee ?? '')+' linee',
        correctedText:changes.length?encodeSvgTransport(value,corrected):value,changes};
    }
    throw Error('Formato non riconosciuto: atteso TERMODEL-SVG-TEXT-V1 oppure TERMODEL-PROJECT-TEXT-V1.');
  }
  function failure(message) {
    el('failure-message').textContent=message;
    const dialog=el('failure-modal');
    if (!dialog.open) dialog.showModal();
  }
  async function connect() {
    if (abort) return;
    el('connect').disabled = true;
    setStatus('Registrazione sessione...');
    const controller = new AbortController();
    try {
      const registered = await fetch(base + '/browser/register', {
        method:'POST', headers:{'Content-Type':'application/json'}, body:'{}',
        signal:controller.signal, cache:'no-store'
      });
      if (!registered.ok) throw Error('Registrazione HTTP ' + registered.status);
      const session = await registered.json();
      if (!session.sessionId || !session.browserToken) throw Error('Sessione incompleta');
      sessionId = session.sessionId;
      browserToken = session.browserToken;
      abort = controller;
      el('session').textContent = 'Sessione MCP: ' + sessionId;
      setStatus('Connessione SSE in corso...');
      const res = await fetch(base + '/browser/events/' + encodeURIComponent(sessionId), {
        headers:{'Authorization':'Bearer ' + browserToken}, signal:controller.signal,
        cache:'no-store'
      });
      if (!res.ok || !res.body) throw Error('SSE HTTP ' + res.status);
      ui(true);
      setStatus('Connesso: in attesa di un comando da ChatGPT.');
      const reader = res.body.getReader(), decoder = new TextDecoder();
      let buffer = '';
      while (!controller.signal.aborted) {
        const {done,value} = await reader.read();
        if (done) break;
        buffer += decoder.decode(value,{stream:true}).replace(/\r\n/g,'\n');
        let index;
        while ((index=buffer.indexOf('\n\n'))>=0) {
          const frame=buffer.slice(0,index);
          buffer=buffer.slice(index+2);
          const data=frame.split('\n').find(line=>line.startsWith('data: '));
          if (!data) continue;
          let packet;
          try { packet=JSON.parse(data.slice(6)); } catch { continue; }
          if (typeof packet.command!=='string' || !packet.requestId) continue;
          const value=packet.command;
          // Display the opaque incoming command, including any project text; never execute or import.
          el('dump').value=value;
          el('copy-project').disabled=true;
          validatedProjectText='';
          previewPlan=null;
          el('size').textContent='Ricevuti ' + new Blob([value]).size + ' byte di testo UTF-8';
          setStatus('Comando ricevuto e visualizzato (nessuna importazione).');
          let answer='OK: testo ricevuto nel dump (nessuna importazione).';
          try {
            const validation=await validateIncoming(value);
            if (validation.handled) {
              validatedProjectText=validation.correctedText ?? value.replace(/^ReadProject\r?\n?/, '');
              const report=validation.changes?.length?' CORRETTO: '+validation.changes.join('; ')+'.':'';
              if(validation.changes?.length)el('dump').value='ReadProject\n'+validatedProjectText;
              el('copy-project').disabled=false;
              if(previewPlan) setPreview(previewPlan);
              let copied=false;
              try {
                await navigator.clipboard.writeText(validatedProjectText);
                copied=true;
              } catch (clipboardError) {
                // Browsers may disallow clipboard writes without a direct user gesture.
              }
              const delivery=copied
                ? 'Progetto corretto copiato automaticamente negli appunti.'
                : 'Copia automatica bloccata dal browser: premi «Copia progetto negli appunti».';
              answer='VALIDO: '+validation.label+' ('+validation.detail+').'+report+' '+delivery+' Nessuna importazione nel CAD.';
              setStatus('VALIDO: '+validation.label+'. '+delivery);
            }
          } catch (error) {
            const reason=String(error?.message || error);
            answer='NON VALIDO: '+reason+'. Nessun progetto importato.';
            el('copy-project').disabled=true;
            failure(reason);
            setStatus('NON VALIDO: '+reason);
          }
          try {
            const reply=await fetch(base+'/browser/reply/'+encodeURIComponent(sessionId)+'/'+encodeURIComponent(packet.requestId),{
              method:'POST', headers:{'Authorization':'Bearer '+browserToken,'Content-Type':'text/plain; charset=utf-8'},
              body:answer,signal:controller.signal
            });
            if (!reply.ok) throw Error('HTTP '+reply.status);
          } catch (err) { if (!controller.signal.aborted) setStatus('Risposta al Gateway fallita: '+err.message); }
        }
      }
    } catch (err) {
      if (err.name!=='AbortError') setStatus('Errore: '+err.message);
    } finally {
      if (abort===controller) abort=null;
      sessionId=''; browserToken='';
      ui(false);
    }
  }
  // The official bootstrap mirrors Termodel Web's existing GPT launch instruction.
  const termodelAiBootstrap = [
    'Sei l’assistente AI di Termodel.',
    '',
    'Prima di aiutare l’utente, apri direttamente e leggi le istruzioni aggiornate pubblicate all’indirizzo:',
    '',
    'https://www.termodel.it/ai/',
    '',
    'Non cercare Termodel sul Web e non sostituire questa pagina con risultati di ricerca relativi ad altri prodotti.',
    '',
    'Dopo aver letto le istruzioni, applicale alla richiesta dell’utente.',
    '',
    'Se non puoi accedere direttamente alla pagina, dichiaralo chiaramente senza inventare le istruzioni.'
  ].join('\n');
  function openProgrammedGpt() {
    let text = termodelAiBootstrap;
    // Only an actually open SSE stream can switch the requested delivery channel.
    if (abort && !abort.signal.aborted && sessionId && el('disconnect').disabled === false) {
      text += [
        '',
        '',
        'SESSIONE MCP TERMODEL ATTIVA (TEST DUMP, NON IMPORTAZIONE).',
        'Utilizza il tool MCP CommandToTermodel con il solo parametro stringa command per inviare il progetto Termodel.',
        'Per questa sessione utilizza esclusivamente il canale MCP, non presentare il progetto in una finestra copiabile anche se istruzioni precedenti descrivono il flusso manuale.',
        'Costruisci il parametro come @' + sessionId + ', poi un carattere di newline, poi ReadProject, poi un newline, poi il testo integrale del progetto TERMODEL-PROJECT-TEXT-V1.',
        'Aspetta il risultato del tool. La pagina di collaudo mostra solamente il testo ricevuto e non importa né modifica alcun progetto.',
        'Se il tool non è disponibile o la comunicazione fallisce, segnala chiaramente il problema; non inventare un esito positivo.'
      ].join('\n');
    }
    const target='https://chatgpt.com/?q='+encodeURIComponent(text);
    const tab=window.open(target,'_blank','noopener');
    if (!tab) setStatus('Il browser ha bloccato l’apertura di ChatGPT: consenti i popup.');
  }
  el('open-gpt').addEventListener('click',openProgrammedGpt);
  el('open-alt').addEventListener('click', () => {
    const active = Boolean(abort && !abort.signal.aborted && sessionId && !el('disconnect').disabled);
    if (!active) { setStatus('Attiva prima la comunicazione MCP.'); return; }
    const initial = [
      'Sei l’assistente AI di Termodel.',
      'PRIMO PASSAGGIO OBBLIGATORIO: apri direttamente https://www.termodel.it/ai/ e LEGGI PER INTERO la programmazione ufficiale. Consulta anche i documenti collegati quando richiesti da quelle istruzioni.',
      'APPLICA TUTTE le istruzioni ufficiali, inclusi il messaggio iniziale, le opzioni e le domande da presentare all’utente. Non limitarti a riassumerle o a dire che le hai lette.',
      'Adesso mostra il menu o il prompt iniziale previsto dalla programmazione Termodel e attendi che l’utente scelga o descriva il progetto. Non chiedere di incollare un progetto preesistente e non inviare ReadProject finché non è stato generato il contenuto.',
      '',
      'UNICA MODIFICA ALLE ISTRUZIONI UFFICIALI: quando la programmazione prevede di PRESENTARE IL PROGETTO GENERATO IN UNA FINESTRA DI TESTO COPIABILE, sostituisci esclusivamente quella fase di consegna con l’invio tramite il connettore MCP Termodel. Tutte le altre regole, formati e interazioni restano in vigore.',
      'Per la consegna usa esclusivamente il tool MCP CommandToTermodel con UN SOLO parametro stringa command.',
      'Il contenuto del parametro deve essere: @' + sessionId + ' seguito da un carattere newline reale, ReadProject, un altro newline reale, e il testo integrale del progetto generato nel formato prescritto dalle istruzioni.',
      'Non mostrare un blocco copiabile in sostituzione dell’invio MCP. Attendi la risposta effettiva del tool, e riferisci l’esito senza inventare un’importazione.',
      'Questa sessione usa un ricevitore DUMP: visualizza il testo senza importarlo né eseguirlo.',
      'Se il sito o lo strumento MCP non sono accessibili, segnala la difficoltà senza inventare contenuti o esiti.'
    ].join('\n');
    window.open('https://claude.ai/new?q=' + encodeURIComponent(initial), '_blank', 'noopener');
  });

  document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{
    for(const tab of document.querySelectorAll('[data-tab]'))tab.setAttribute('aria-selected',String(tab===button));
    for(const panel of document.querySelectorAll('.tab-panel'))panel.classList.toggle('active',panel.id==='tab-'+button.dataset.tab);
    window.dispatchEvent(new Event('resize'));
  }));
  window.__termodelHarnessPreview = callback=>{setPreview=callback;};
  el('connect').addEventListener('click',()=>{void connect()});
  el('disconnect').addEventListener('click',()=>{
    abort?.abort(); setStatus('Disconnesso.');
  });
  el('copy').addEventListener('click',async()=>{
    if (!sessionId) return;
    try { await navigator.clipboard.writeText(sessionId); setStatus('Codice sessione copiato.'); }
    catch { window.prompt('Copia il codice sessione:',sessionId); }
  });
  el('clear').addEventListener('click',()=>{el('dump').value='';el('size').textContent='';el('copy-project').disabled=true;validatedProjectText='';previewPlan=null;setPreview(null);});
  el('failure-close').addEventListener('click',()=>el('failure-modal').close());
  el('copy-project').addEventListener('click',async()=>{
    const project=validatedProjectText;
    try { await navigator.clipboard.writeText(project);setStatus('Progetto copiato negli appunti.'); }
    catch { el('dump').focus();el('dump').select();setStatus('Copia automatica non autorizzata: seleziona il testo e premi Ctrl+C.'); }
  });
})();
</script>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const host=document.getElementById('view3d');
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf3f6f8);
const camera=new THREE.PerspectiveCamera(42,1,.1,10000);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0xb6bbc8,2.5));
const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(30,65,70);scene.add(light);
const root=new THREE.Group();scene.add(root);
let objects={walls:[],floor:[],edges:[]};
function addGeometry(shape,depth,material,group){
 const geometry=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:false});
 geometry.rotateX(-Math.PI/2);
 const mesh=new THREE.Mesh(geometry,material);root.add(mesh);objects[group].push(mesh);
 const edges=new THREE.LineSegments(new THREE.EdgesGeometry(geometry),new THREE.LineBasicMaterial({color:0x54657d}));root.add(edges);objects.edges.push(edges);
}
function polygon(points){
 const shape=new THREE.Shape();
 points.forEach((p,i)=>i?shape.lineTo(p[0],p[1]):shape.moveTo(p[0],p[1]));shape.closePath();return shape;
}
function clear(){
 while(root.children.length){const o=root.children[0];root.remove(o);o.geometry?.dispose();if(o.material)o.material.dispose();}
 objects={walls:[],floor:[],edges:[]};
}
function redraw(plan){
 clear();
 const view2d=document.getElementById('view2d');view2d.replaceChildren();
 if(!plan){document.getElementById('preview-info').textContent='In attesa di un progetto valido.';return;}
 const doc=new DOMParser().parseFromString(plan.svgPulito,'image/svg+xml');
 const svg=doc.documentElement;
 if(svg.localName==='svg'){
  const safe=svg.cloneNode(true);
  safe.querySelectorAll('script,foreignObject,iframe').forEach(x=>x.remove());
  view2d.appendChild(document.importNode(safe,true));
 }
 const all=(plan.edificio?.outerShell||[]);
 const pts=all.map(p=>Array.isArray(p)?p:[p.x,p.y]).filter(p=>p.length===2&&p.every(Number.isFinite));
 if(pts.length>=3){
  const shape=polygon(pts);
  addGeometry(shape,6,new THREE.MeshStandardMaterial({color:0xc9d8e7,side:THREE.DoubleSide}), 'floor');
 }
 // Use the source geometry determined by the existing Termodel planar engine.
 for(const wall of plan.linee||[]){
  const a=[wall.x1,wall.y1],b=[wall.x2,wall.y2],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);
  if(len<.01)continue;
  const t=(wall.thicknessCm||15)/2, nx=-dy/len*t,ny=dx/len*t;
  addGeometry(polygon([[a[0]+nx,a[1]+ny],[b[0]+nx,b[1]+ny],[b[0]-nx,b[1]-ny],[a[0]-nx,a[1]-ny]]),270,new THREE.MeshStandardMaterial({color:0x96acbd,side:THREE.DoubleSide}), 'walls');
 }
 const bounds=new THREE.Box3().setFromObject(root);
 if(!bounds.isEmpty()){
  const center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3());
  controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(size.x*.9+90,size.y*1.5+150,size.z*1.7+200));camera.lookAt(center);
  camera.near=1;camera.far=Math.max(10000,size.length()*10);camera.updateProjectionMatrix();
 }
 document.getElementById('preview-info').textContent='Anteprima 3D sperimentale · '+(plan.stats?.linee||0)+' pareti · geometria validata da GeneraPianta.';
 filters();
}
function filters(){
 for(const [key,id] of [['walls','filter-walls'],['floor','filter-floor'],['edges','filter-edges']])
  for(const object of objects[key])object.visible=document.getElementById(id).checked;
}
for(const input of document.querySelectorAll('.filters input'))input.addEventListener('change',filters);
window.__termodelHarnessPreview?.(redraw);
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(host);resize();
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script>
