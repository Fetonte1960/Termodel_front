name: Termodel MCP browser syntax
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/termodel-ui-demo/app.js'
      - 'docs/termodel-ui-demo/index.html'
      - 'docs/termodel-ui-demo/frontend-version.txt'
      - '.github/workflows/termodel-mcp-browser-check.yml'
permissions:
  contents: read
  statuses: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: RUNNING
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=pending -f context=Termodel/job -f description="MCP browser checks running" > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and wiring
        run: |
          node --check docs/termodel-ui-demo/app.js
          node --check docs/termodel-ui-demo/termodel-project-text.js
          grep -q 'aiImportConnectMcp' docs/termodel-ui-demo/index.html
          grep -q 'startTermodelMcpImportSession' docs/termodel-ui-demo/app.js
          grep -q "importAiText(payload, { source: 'mcp' })" docs/termodel-ui-demo/app.js
          # La versione del frontend evolve indipendentemente dalla suite MCP.
          # Verificare il formato, non bloccare un valore storico (1.85).
          tr -d '\r\n' < docs/termodel-ui-demo/frontend-version.txt | grep -Eq '^[0-9]+\\.[0-9]+
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f context=Termodel/job -f description="MCP browser syntax OK" > /dev/null
          else
            gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=failure -f context=Termodel/job -f description="MCP browser check failed" > /dev/null
          fi

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f context=Termodel/job -f description="MCP browser syntax OK" > /dev/null
          else
            gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=failure -f context=Termodel/job -f description="MCP browser check failed" > /dev/null
          fi
