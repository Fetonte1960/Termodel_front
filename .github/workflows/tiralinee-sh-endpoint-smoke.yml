name: Tiralinee SH no-prefix E2E smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tiralinee-sh-endpoint-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate SH local intents and deny remote without session
        shell: bash
        run: |
          node <<'NODE'
          const assert=(await import('node:assert/strict')).default;
          const root='https://termodel-mcp-gateway.onrender.com';
          const origin='https://www.termodel.it';
          const sleep=ms=>new Promise(ok=>setTimeout(ok,ms));
          for(let i=0;i<14;i++){
            try{const r=await fetch(root+'/health',{signal:AbortSignal.timeout(18000)});
                if(r.ok)break;}catch{}
            if(i===13)throw Error('Gateway health non disponibile');
            await sleep(9000);
          }
          const unauthorized=await fetch(root+'/browser/lab/register',{method:'POST'});
          assert.equal(unauthorized.status,401);
          const registered=await fetch(root+'/browser/lab/register',{
            method:'POST',headers:{Origin:origin}});
          assert.equal(registered.status,200);
          const cred=await registered.json();
          assert.match(cred.id,/^[a-f0-9]{32}$/);
          assert.match(cred.token,/^[a-f0-9]{64}$/);

          // The browser's first action must be a Service-native, fixed
          // SOS-TEST-001 model read through the SAME temporary lab session.
          const modelUrl=root+'/browser/lab/model/'+cred.id;
          const deniedModel=await fetch(modelUrl,{
            headers:{Origin:origin,Authorization:'Bearer invalid'}});
          assert.equal(deniedModel.status,401,'Invalid model bearer must fail');
          const modelResponse=await fetch(modelUrl,{
            headers:{Origin:origin,Authorization:'Bearer '+cred.token},
            signal:AbortSignal.timeout(65000)});
          assert.equal(modelResponse.status,200,'Auto-start Service model not available');
          assert.equal(modelResponse.headers.get('x-sos-model-source'),'TermodelService');
          const model=await modelResponse.json();
          assert.equal(model.format,'TermodelWebModel');
          assert.equal(model.version,3);
          assert.equal(model.coordinateSystem,'Z-up');
          assert.ok(model.primitives.length>0,'Missing actual Service meshes');
          const modelCount=model.primitives.length;
          const dialogueRoot=root+'/browser/lab/dialog/'+cred.id;
          const treeAuth={Origin:origin,Authorization:'Bearer '+cred.token};
          const deniedTree=await fetch(dialogueRoot,{
            headers:{Origin:origin,Authorization:'Bearer bad'}});
          assert.equal(deniedTree.status,401);
          const first=await fetch(dialogueRoot,{headers:treeAuth});
          assert.equal(first.status,200,'Neon tree root unavailable');
          const rootNode=await first.json();
          assert.equal(rootNode.node.id,'inizio');
          assert.equal(rootNode.mode,'demo');
          assert.ok(rootNode.choices.some(x=>x.id==='filtri'));
          assert.ok(!rootNode.choices.some(x=>x.id==='sos'),'Paired branch leaked in demo');
          const filtersResponse=await fetch(dialogueRoot+'?node=filtri',{headers:treeAuth});
          assert.equal(filtersResponse.status,200);
          const filters=await filtersResponse.json();
          assert.ok(filters.choices.some(x=>x.id==='filtri.nascondi_pareti'));
          const leafResponse=await fetch(dialogueRoot+'?node=filtri.nascondi_pareti',{headers:treeAuth});
          const leaf=await leafResponse.json();
          assert.equal(leaf.node.canExecute,true);
          const runAction=await fetch(dialogueRoot+'/execute/filtri.nascondi_pareti',{
            method:'POST',headers:treeAuth});
          assert.equal(runAction.status,200);
          const executed=await runAction.json();
          assert.equal(executed.destination,'LOCAL_VIEWER');
          assert.equal(executed.command.action,'filter');
          assert.equal(executed.command.checkedState,false);
          const deniedPaired=await fetch(dialogueRoot+'?node=sos',{headers:treeAuth});
          assert.equal(deniedPaired.status,404);
          const deniedPairedAction=await fetch(dialogueRoot+'/execute/sos.commesse',{
            method:'POST',headers:treeAuth});
          assert.equal(deniedPairedAction.status,404);
          const url=root+'/browser/lab/interpret/'+cred.id;
          const headers={Origin:origin,'Content-Type':'application/json',
            Authorization:'Bearer '+cred.token};
          const bad=await fetch(url,{method:'POST',headers:{...headers,Authorization:'Bearer bad'},
            body:JSON.stringify({message:'zoom avanti'})});
          assert.equal(bad.status,401);
          const call=async message=>{
            const response=await fetch(url,{method:'POST',headers,signal:AbortSignal.timeout(120000),
              body:JSON.stringify({message})});
            const answer=await response.json();return{status:response.status,answer};
          };
          const zoom=await call('zoom avanti');
          assert.equal(zoom.status,200,JSON.stringify(zoom));
          assert.equal(zoom.answer.esito,'SUCCESS');
          assert.equal(zoom.answer.destination,'LOCAL_VIEWER');
          assert.equal(zoom.answer.command.action,'zoom');
          assert.ok(zoom.answer.command.factor<1);
          const hide=await call('nascondi pareti');
          assert.equal(hide.status,200,JSON.stringify(hide));
          assert.equal(hide.answer.command.action,'filter');
          assert.equal(hide.answer.command.checkedState,false);
          const restricted=await call('quante pratiche aperte ci sono');
          assert.equal(restricted.status,403,JSON.stringify(restricted));
          assert.equal(restricted.answer.reason,'sos_session_required');
          const unrecognized=await call('aiutami a riparare una navicella spaziale su marte');
          assert.equal(unrecognized.status,200,JSON.stringify(unrecognized));
          assert.equal(unrecognized.answer.esito,'FAULT','Unknown intent must invite expert consent');
          console.log('SH_TIRALINEE_STARTUP_OK Service_model='+modelCount+' zoom/local=200 pareti/local=200 farmacia/no-session=403 unknown=FAULT NeonDialog=PASS');
          NODE
