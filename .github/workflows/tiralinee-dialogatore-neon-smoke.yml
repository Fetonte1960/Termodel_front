name: SOS Neon guided dialogue smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tiralinee-dialogatore-neon-smoke.yml'
      - 'docs/termodel-ui-demo/tiralinee-guided-chat.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify dynamic Neon tree and protected Gateway actions
        shell: bash
        run: |
          node <<'NODE'
          const assert=(await import('node:assert/strict')).default;
          const root='https://termodel-mcp-gateway.onrender.com';
          const origin='https://www.termodel.it';
          let health;
          for(let i=0;i<12;i++){
            try{health=await fetch(root+'/health',{signal:AbortSignal.timeout(20000)});
              if(health.ok)break;}catch{}
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          assert.equal(health?.status,200,'Gateway not ready');
          const reg=await fetch(root+'/browser/lab/register',{method:'POST',headers:{Origin:origin}});
          assert.equal(reg.status,200);
          const cred=await reg.json();
          const base=root+'/browser/lab/dialog/'+cred.id;
          const headers={Origin:origin,Authorization:'Bearer '+cred.token};
          const denied=await fetch(base,{headers:{Origin:origin,Authorization:'Bearer invalid'}});
          assert.equal(denied.status,401);
          const get=async id=>{
            const r=await fetch(base+'?node='+encodeURIComponent(id),{headers});
            return {status:r.status,data:r.status===200?await r.json():null};
          };
          const first=await get('inizio');
          assert.equal(first.status,200);
          assert.equal(first.data.node.id,'inizio');
          assert.equal(first.data.mode,'demo');
          assert.equal(first.data.node.message,'Che tipo di disservizio hai?');
          const expected=[
            'disservizi.idrico',
            'disservizi.elettrico',
            'disservizi.climatizzazione',
            'disservizi.intrusione_vetri_infissi'
          ];
          assert.deepEqual(first.data.choices.map(c=>c.id),expected);
          // The return-to-root button MUST fetch a new Neon response without
          // restarting the browser or rebuilding the client.
          const reread=await fetch(base+'?node=inizio&_refresh='+Date.now(),{
            headers:{...headers,'Cache-Control':'no-cache'},cache:'no-store'});
          assert.equal(reread.status,200,'Fresh root must be served from Neon');
          assert.match(reread.headers.get('cache-control')||'',/no-store/i);
          const freshRoot=await reread.json();
          assert.equal(freshRoot.node.id,'inizio');
          assert.deepEqual(freshRoot.choices.map(c=>c.id),expected);
          const leaf=await get('disservizi.idrico');
          assert.equal(leaf.status,200);
          assert.equal(leaf.data.node.canExecute,false);
          assert.deepEqual(leaf.data.choices,[]);
          assert.equal((await get('sos')).status,404);
          assert.equal((await get('filtri')).status,404);
          const noAction=await fetch(base+'/execute/disservizi.idrico',{
            method:'POST',headers});
          assert.equal(noAction.status,404,'Classification must not create an intervention');
          const forbidden=await fetch(base+'/execute/sos.aperti',{method:'POST',headers});
          assert.equal(forbidden.status,404);
          const tamper=await fetch(base+'/execute/disservizi.idrico',{
            method:'POST',headers,body:JSON.stringify({action:'delete'})});
          assert.equal(tamper.status,400);
          console.log('SOS_NEON_DIALOGUE_OK nodes=root/four incident types classification=no-action paired-hidden=404 invalid=401');
          NODE
