name: SOS Neon guided dialogue smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tiralinee-dialogatore-neon-smoke.yml'
      - 'docs/termodel-ui-demo/tiralinee-guided-chat.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify root navigation and explicit guided assistance CTA
        shell: bash
        run: |
          node <<'NODE'
          const assert=(await import('node:assert/strict')).default;
          const {readFileSync}=await import('node:fs');
          const script=readFileSync('docs/termodel-ui-demo/tiralinee-guided-chat.js','utf8');
          new Function('window','document',script);
          class Element {
            constructor(tag){this.tag=tag;this.children=[];this.listeners={};this.disabled=false;}
            appendChild(x){this.children.push(x);}
            remove(){this.removed=true;}
            setAttribute(){}
            addEventListener(name,callback){this.listeners[name]=callback;}
            querySelectorAll(){return this.children.filter(x=>x.tag==='button');}
          }
          const target={};const document={createElement:tag=>new Element(tag)};
          new Function('window','document',script)(target,document);
          const box=new Element('container');
          let reads=0,request=null;
          const chat=target.SosGuidedChat.create({
            container:box,available:()=>true,addMessage:()=>new Element('message'),
            read:async id=>{
              reads++;
              return id==='inizio'
                ?{node:{id,message:'Che tipo di disservizio hai?'},choices:[
                    {id:'disservizi.idrico',label:'Nella rete idrica'}]}
                :{node:{id,message:'Disservizio idrico confermato'},choices:[]};
            },
            onNoAction:()=>{},onRequestAssistance:p=>{request=p;}
          });
          const current=()=>box.children.at(-1).children;
          const labels=()=>current().map(x=>x.textContent);
          await chat.start();
          assert.deepEqual(labels(),['Nella rete idrica','Esaminare richieste di assistenza in corso']);
          current()[0].listeners.click();
          await new Promise(r=>setTimeout(r,10));
          assert(labels().includes('Attiva una richiesta di assistenza con i dati raccolti'));
          assert(labels().includes('Torna al menu iniziale'));
          const action=current().find(x=>x.textContent.startsWith('Attiva una richiesta'));
          await action.listeners.click();
          assert.equal(request.categoryNodeId,'disservizi.idrico');
          assert.equal(request.steps[0].answer,'Nella rete idrica');
          current().find(x=>x.textContent==='Torna al menu iniziale').listeners.click();
          await new Promise(r=>setTimeout(r,10));
          assert.deepEqual(labels(),['Nella rete idrica','Esaminare richieste di assistenza in corso']);
          assert.equal(reads,3);
          console.log('GUIDED_ROOT_AND_REQUEST_UI_OK');
          NODE
      - name: Verify dynamic Neon tree and protected Gateway actions
        shell: bash
        run: |
          node <<'NODE'
          const assert=(await import('node:assert/strict')).default;
          const root='https://termodel-mcp-gateway.onrender.com';
          const origin='https://www.termodel.it';
          let health;
          for(let i=0;i<12;i++){
            try{health=await fetch(root+'/health',{signal:AbortSignal.timeout(20000)});
              if(health.ok)break;}catch{}
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          assert.equal(health?.status,200,'Gateway not ready');
          const reg=await fetch(root+'/browser/lab/register',{method:'POST',headers:{Origin:origin}});
          assert.equal(reg.status,200);
          const cred=await reg.json();
          const base=root+'/browser/lab/dialog/'+cred.id;
          const headers={Origin:origin,Authorization:'Bearer '+cred.token};
          const denied=await fetch(base,{headers:{Origin:origin,Authorization:'Bearer invalid'}});
          assert.equal(denied.status,401);
          const get=async id=>{
            const r=await fetch(base+'?node='+encodeURIComponent(id),{headers});
            return {status:r.status,data:r.status===200?await r.json():null};
          };
          const first=await get('inizio');
          assert.equal(first.status,200);
          assert.equal(first.data.node.id,'inizio');
          assert.equal(first.data.mode,'demo');
          assert.equal(first.data.node.message,'Che tipo di disservizio hai?');
          const expected=[
            'disservizi.idrico',
            'disservizi.elettrico',
            'disservizi.climatizzazione',
            'disservizi.intrusione_vetri_infissi',
            'tecnico'
          ];
          assert.deepEqual(first.data.choices.map(c=>c.id),expected);
          // The return-to-root button MUST fetch a new Neon response without
          // restarting the browser or rebuilding the client.
          const reread=await fetch(base+'?node=inizio&_refresh='+Date.now(),{
            headers:{...headers,'Cache-Control':'no-cache'},cache:'no-store'});
          assert.equal(reread.status,200,'Fresh root must be served from Neon');
          assert.match(reread.headers.get('cache-control')||'',/no-store/i);
          const freshRoot=await reread.json();
          assert.equal(freshRoot.node.id,'inizio');
          assert.deepEqual(freshRoot.choices.map(c=>c.id),expected);
          const technician=await get('tecnico');
          assert.equal(technician.status,200);
          assert.equal(technician.data.node.canRequestAssistance,false);
          assert.equal(technician.data.choices.length,8);
          const demoAssets=await get('tecnico.apparati');
          assert.equal(demoAssets.status,200);
          assert.equal(demoAssets.data.choices.length,7);
          assert(demoAssets.data.choices.some(x=>x.id==='tec.asset.QG-01'));
          const electric=await get('tecnico.elettrico');
          assert.equal(electric.data.choices.length,4);
          const plumbing=await get('tecnico.idrico');
          assert.deepEqual(plumbing.data.choices.map(x=>x.id),['tec.asset.VAL-GEN-01']);
          const qg=await get('tec.asset.QG-01');
          assert.equal(qg.status,200);
          assert.equal(qg.data.node.roomId,'locale_6');
          assert.equal(qg.data.node.roomSelection,true);
          assert.equal(qg.data.node.canRequestAssistance,false);
          assert.match(qg.data.node.message,/P3D-D0012/);
          assert.match(qg.data.node.message,/destra/);
          assert.equal(qg.data.choices.length,5);
          const location=await get('tec.pos.QG-01.destra');
          assert.equal(location.status,200);
          assert.match(location.data.node.message,/Conforme al posizionamento/);
          const fridge=await get('tec.asset.FR-01');
          assert.equal(fridge.status,200);
          assert.equal(fridge.data.node.roomId,'locale_6');
          const climate=await get('tec.asset.CLIMA-01');
          assert.equal(climate.status,200);
          assert.equal(climate.data.node.roomId,'locale_3');
          assert.equal((await get('tec.asset.UNKNOWN-01')).status,404);
          const room3d=await get('tec.room.loc.locale_6');
          assert.equal(room3d.status,200);
          assert(room3d.data.node.wallSourceIds.length>=4);
          const hydraulic=await get('disservizi.idrico');
          assert.equal(hydraulic.status,200);
          assert.equal(hydraulic.data.node.canExecute,false);
          assert.deepEqual(hydraulic.data.choices.map(c=>c.label),
            ['Perdita','Mancanza di servizio']);
          const leak=await get('disservizi.idrico.perdita');
          assert.equal(leak.status,200);
          assert.equal(leak.data.node.canExecute,false,
            'Room selection is a read action, not an executable SH command');
          assert.equal(leak.data.node.message,
            'Questi sono i locali, in quale si è verificato il problema?');
          assert.equal(leak.data.choices.length,7,'Room count from Termodel V3');
          assert(leak.data.choices[0].label.startsWith('1. '));
          assert(leak.data.choices[6].label.startsWith('7. '));
          assert(leak.data.choices.every(x=>x.id.startsWith('sos.room.perdita.')));
          const selected=await get(leak.data.choices[0].id);
          assert.equal(selected.status,200);
          assert.equal(selected.data.node.roomSelection,true);
          assert.equal(selected.data.node.roomId,'locale_1');
          assert.deepEqual(selected.data.choices,[]);
          assert.equal(selected.data.node.wallSourceIds.length,5,
            'Ufficio has five topology wall identities');
          assert.equal(new Set(selected.data.node.wallSourceIds).size,5);
          const service=await fetch(root+'/browser/lab/model/'+cred.id,{headers});
          assert.equal(service.status,200);
          const model=await service.json();
          assert.equal(model.format,'TermodelWebModel');
          assert.equal(model.version,3);
          assert.equal(model.primitives.length,386);
          const rev=decodeURIComponent(service.headers.get('X-SOS-Project-Revision')||'');
          assert.equal(selected.data.node.topologyRevision,rev);
          for(const choice of leak.data.choices){
            const result=await get(choice.id);
            assert.equal(result.status,200,'Room selection available: '+choice.id);
            const ids=result.data.node.wallSourceIds;
            assert(ids.length>0 && ids.length<=80);
            for(const id of ids)
              assert.equal(model.primitives.filter(p=>p.id===id&&p.tipo==='Parete').length,2,
                'Each selected topological wall has exactly two 3D meshes: '+id);
          }
          const breakInMenu=await get('disservizi.intrusione_vetri_infissi');
          assert.deepEqual(breakInMenu.data.choices.map(x=>x.label),['Effrazione']);
          const burglary=await get('disservizi.intrusione_vetri_infissi.effrazione');
          assert.equal(burglary.status,200);
          assert.equal(burglary.data.choices.length,7);
          assert(burglary.data.choices.every(x=>x.id.startsWith('sos.room.effrazione.')));
          const direction=await get('sos.room.effrazione.locale_3');
          assert.equal(direction.status,200);
          assert.equal(direction.data.node.message,
            "L'infisso interessato dà verso l'esterno?");
          assert.deepEqual(direction.data.choices.map(c=>c.label),[
            "Sì, verso l'esterno","No, verso un locale interno",
            "Non lo so, mostra tutti gli infissi"
          ]);
          const external=await get('sos.fin.boundary.ext.locale_3');
          const internal=await get('sos.fin.boundary.int.locale_3');
          const unknown=await get('sos.fin.boundary.all.locale_3');
          assert.equal(external.status,200);
          assert.equal(internal.status,200);
          assert.equal(unknown.status,200);
          const candidates=r=>r.data.choices.filter(x=>x.id.startsWith('sos.fin.pick.'));
          assert.equal(candidates(external).length,2);
          assert.equal(candidates(internal).length,6);
          assert.equal(candidates(unknown).length,8);
          assert(candidates(external).every(x=>x.id.includes('.ext.')));
          assert(candidates(internal).every(x=>x.id.includes('.int.')));
          const window=await get(candidates(external)[0].id);
          assert.equal(window.status,200,'Valid P3D-O uppercase IDs must no longer get HTTP 400');
          assert.equal(window.data.node.openingSelection,true);
          assert.equal(window.data.node.canRequestAssistance,false);
          const yes=window.data.choices.find(x=>x.id.startsWith('sos.fin.yes.ext.'));
          const no=window.data.choices.find(x=>x.label.startsWith('No,'));
          assert(yes&&no);
          assert.equal(no.id,'sos.fin.boundary.ext.locale_3');
          const confirmed=await get(yes.id);
          assert.equal(confirmed.status,200);
          assert.equal(confirmed.data.node.openingConfirmed,true);
          assert.equal((await get('sos.fin.pick.ext.locale_3.P3D-O9999')).status,404);
          assert.equal((await get('sos.fin.pick.int.locale_3.P3D-O0009')).status,404);
          assert.equal((await get('sos.room.perdita.locale_999')).status,404);
          assert.equal((await get('sos')).status,404);
          assert.equal((await get('filtri')).status,404);
          const noAction=await fetch(base+'/execute/disservizi.idrico',{
            method:'POST',headers});
          assert.equal(noAction.status,404,'Classification must not create an intervention');
          const forbidden=await fetch(base+'/execute/sos.aperti',{method:'POST',headers});
          assert.equal(forbidden.status,404);
          const tamper=await fetch(base+'/execute/disservizi.idrico',{
            method:'POST',headers,body:JSON.stringify({action:'delete'})});
          assert.equal(tamper.status,400);
          const review=await fetch(root+'/browser/lab/sos/requests/'+cred.id,{headers});
          assert.equal(review.status,200,'Active SOS worklist from Neon');
          const reviewBody=await review.json();
          assert.equal(reviewBody.status,'available');
          assert(Array.isArray(reviewBody.data?.richieste));
          const reviewDenied=await fetch(root+'/browser/lab/sos/requests/'+cred.id,{
            headers:{Origin:origin,Authorization:'Bearer invalid'}});
          assert.equal(reviewDenied.status,401);
          const noConsent=await fetch(root+'/browser/lab/sos/guided-assistance/'+cred.id,{
            method:'POST',headers:{...headers,'Content-Type':'application/json'},
            body:JSON.stringify({
              categoryNodeId:'disservizi.idrico',
              steps:[{id:'disservizi.idrico',answer:'Nella rete idrica'}],
              rischioPersone:false,urgenza:'ordinaria',confermaEsplicita:false
            })
          });
          assert.equal(noConsent.status,400,'No registration without explicit consent');
          const intakeDenied=await fetch(root+'/browser/lab/sos/guided-assistance/'+cred.id,{
            method:'POST',headers:{Origin:origin,'Content-Type':'application/json'},
            body:'{}'
          });
          assert.equal(intakeDenied.status,401);

          const unauthorizedIntake=await fetch(root+
            '/browser/sos/guided-assistance/'+'0'.repeat(40),{
              method:'POST',
              headers:{Origin:origin,'Content-Type':'application/json'},
              body:JSON.stringify({categoryNodeId:'disservizi.idrico',
                steps:[{id:'disservizi.idrico',answer:'Nella rete idrica'}],
                rischioPersone:false,urgenza:'ordinaria',confermaEsplicita:true})
            });
          assert.equal(unauthorizedIntake.status,401,
            'Unpaired request must never create a SOS intervention');
          console.log('SOS_NEON_DIALOGUE_OK nodes=root/four incident types classification=no-action paired-hidden=404 invalid=401');
          NODE
